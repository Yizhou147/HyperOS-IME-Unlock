name: 云编译 Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 不使用 android-actions/setup-android：runner 镜像已预装 Android SDK
      # （ANDROID_HOME=/usr/local/lib/android/sdk，含 android-34 platform 与 build-tools 34.0.0），
      # 而新版 sdkmanager 已无法解析该 action 默认安装的 'tools' 包，
      # 会以 "Failed to find package 'tools'" 失败。

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build release APK
        run: |
          set -euo pipefail
          mkdir -p unsigned
          ./gradlew :app:assembleRelease --stacktrace -Pdiag=false
          cp app/build/outputs/apk/release/*.apk unsigned/normal.apk
          ./gradlew :app:assembleRelease --stacktrace -Pdiag=true
          cp app/build/outputs/apk/release/*.apk unsigned/diag.apk

      - name: Sign release APK
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          # 使用固定签名（keystore 来自仓库 Secrets），不再每次 keytool 临时生成，
          # 否则每次构建的签名都不同，产物无法覆盖安装。
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE"
          mkdir -p signed
          "$APKSIGNER" sign --ks "$KEYSTORE" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out signed/Unlock_HyperOS_IME.apk unsigned/normal.apk
          "$APKSIGNER" sign --ks "$KEYSTORE" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out signed/Unlock_HyperOS_IME_diag.apk unsigned/diag.apk
          for OUT in signed/Unlock_HyperOS_IME.apk signed/Unlock_HyperOS_IME_diag.apk; do
            echo "=== 签名证书（$OUT，应按固定指纹输出）==="
            "$APKSIGNER" verify --print-certs "$OUT" | head -3
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unlock_HyperOS_IME
          path: signed/*.apk
          retention-days: 30

      # 不自动发布 Release：构建产物只进 Artifacts，
      # 由维护人验收后手动 gh release create（见 AGENTS/工作总结规则）。
